<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Линия фронта — прототип карты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --panel: rgba(20, 22, 17, 0.82);
      --border: rgba(255, 240, 200, 0.14);
      --text: #e9e4d4;
      --muted: #a9a38f;
      --accent: #ffd36b;
      --red: #d9534f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d17; color: var(--text); font-family: "PT Sans", system-ui, sans-serif; }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; touch-action: none; display: block; }
    #map:active { cursor: grabbing; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; backdrop-filter: blur(6px); }
    #top { top: 12px; left: 12px; padding: 10px 14px; max-width: calc(100vw - 24px); }
    #top h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: 0.02em; }
    #top .sides { font-size: 13px; color: var(--muted); }
    #top .sides b.blue { color: #6fa8ff; }
    #top .sides b.red { color: #ff7b72; }
    #info { font-size: 11px; color: var(--muted); margin-top: 4px; }
    #tools { top: 12px; right: 12px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: min(400px, calc(50vw - 200px)); }
    button { font: inherit; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: rgba(255, 255, 255, 0.12); }
    button.active { background: rgba(255, 211, 107, 0.2); border-color: var(--accent); color: var(--accent); }
    #btn-strike.active { background: rgba(217, 83, 79, 0.25); border-color: var(--red); color: #ffb3ae; }
    #minimap { bottom: 12px; right: 12px; width: 240px; height: 160px; padding: 0; overflow: hidden; cursor: pointer; }
    #bottom { bottom: 12px; left: 12px; padding: 8px 12px; font-size: 12px; color: var(--muted); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    #scale { display: flex; flex-direction: column; gap: 3px; }
    #scale-bar { height: 5px; border: 1.5px solid var(--text); border-top: none; }
    #help { font-size: 12px; }
    kbd { font-family: inherit; background: rgba(255,255,255,0.1); border-radius: 3px; padding: 0 4px; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 8px 14px; font-size: 13px; pointer-events: none; transition: opacity 0.3s; }
    #timebar { top: 12px; left: 50%; transform: translateX(-50%); padding: 6px; display: flex; gap: 4px; align-items: center; }
    #clock { font-weight: 700; font-size: 14px; padding: 0 10px; min-width: 132px; text-align: center; font-variant-numeric: tabular-nums; }
    #timebar button { padding: 4px 9px; }
    #selpanel { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px 10px; display: none; flex-direction: column; gap: 6px; width: min(460px, calc(100vw - 24px)); max-height: min(260px, 40vh); }
    #selpanel .head { display: flex; gap: 6px; align-items: center; }
    #selpanel .head .grow { flex: 1; font-weight: 700; font-size: 13px; }
    #sel-list { overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
    .unit-row { display: flex; gap: 8px; align-items: center; font-size: 12.5px; line-height: 1.2; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
    .unit-row:hover { background: rgba(255,255,255,0.06); }
    .unit-row canvas { width: 33px; height: 22px; flex: none; }
    .muted { color: var(--muted); font-size: 12px; }
    .st { color: var(--muted); font-size: 12px; }
    #toast { top: 64px; left: 50%; transform: translateX(-50%); padding: 7px 14px; font-size: 13px; opacity: 0; transition: opacity 0.4s; pointer-events: none; max-width: calc(100vw - 24px); }
    .soldiers { display: flex; flex-wrap: wrap; gap: 4px; }
    .soldier { font-size: 11.5px; padding: 3px 7px; }
    .soldier.active { background: rgba(255, 242, 122, 0.2); border-color: #fff27a; color: #fff6b0; }
    #btn-clear.active { background: rgba(255, 157, 107, 0.2); border-color: #ff9d6b; color: #ffc8a8; }
    #btn-stealth.active { background: rgba(140, 220, 120, 0.2); border-color: #9be07f; color: #c5f5b0; }
    @media (max-width: 900px) {
      #top { display: none; }
      #selpanel { bottom: 124px; }
    }
    @media (max-width: 640px) {
      #minimap { width: 150px; height: 100px; }
      #help { display: none; }
      #tools { top: auto; bottom: 124px; right: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>

  <div id="top" class="panel">
    <h1>Линия фронта · прототип карты</h1>
    <div class="sides">Стороны: <b class="blue">Синие</b> vs <b class="red">Красные</b> · окопы и подземные ходы</div>
    <div id="info"></div>
  </div>

  <div id="timebar" class="panel">
    <span id="clock">—</span>
    <button data-speed="0" title="Пауза (Пробел)">⏸</button>
    <button data-speed="1" title="Клавиша 1">1×</button>
    <button data-speed="5" title="Клавиша 2">5×</button>
    <button data-speed="20" title="Клавиша 3">20×</button>
    <button data-speed="60" title="Клавиша 4">60×</button>
  </div>

  <div id="selpanel" class="panel">
    <div class="head">
      <span id="sel-title" class="grow"></span>
      <button id="btn-clear" title="C: зачистить траншею — затем клик по точке на траншее">Зачистить</button>
      <button id="btn-stealth" title="G: маршрут скрытно — вдоль посадок, избегая открытых мест">Скрытно</button>
      <button id="btn-stop" title="X: остановиться">Стоп</button>
    </div>
    <div id="sel-task" class="muted"></div>
    <div id="sel-list"></div>
  </div>

  <div id="tools" class="panel">
    <button id="btn-side" title="Tab: сменить управляемую сторону (для теста)">Сторона</button>
    <button id="btn-labels" title="Подписи (L)">Подписи</button>
 <button id="btn-forts" title="O: показать окопы схемой / подземный слой">Окопы</button>
    <button id="btn-dig" title="T: выкопать траншею по точкам">Копать траншею</button>
    <button id="btn-strike" title="Артудар (B): клик по карте оставляет воронки">Артудар</button>
    <button id="btn-new" title="Сгенерировать другую карту">Новая карта</button>
  </div>

  <canvas id="minimap" class="panel"></canvas>

  <div id="bottom" class="panel">
    <div id="scale"><div id="scale-bar"></div><span id="scale-label"></span></div>
    <span id="coords">—</span>
    <span id="help"><kbd>ЛКМ</kbd> выбор/тянуть · <kbd>Shift</kbd>+рамка · <kbd>ПКМ</kbd> приказ · <kbd>G</kbd> скрытно · <kbd>X</kbd> стоп · <kbd>Пробел</kbd> пауза · <kbd>C</kbd> зачистить · <kbd>O</kbd> окопы · <kbd>T</kbd> копать · <kbd>B</kbd> артудар</span>
  </div>

  <div id="toast" class="panel"></div>
  <div id="loading" class="panel">Прорисовка местности…</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
